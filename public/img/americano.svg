<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 240" width="250" height="240">
  <defs>
    <linearGradient id="bgAmericano" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#705d50"/>
      <stop offset="100%" stop-color="#4a3b30"/>
    </linearGradient>
    <linearGradient id="mugWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ebe3d5"/>
      <stop offset="50%" stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#d4c6b2"/>
    </linearGradient>
    <linearGradient id="coffeeLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2a16"/>
      <stop offset="50%" stop-color="#341b0d"/>
      <stop offset="100%" stop-color="#190c05"/>
    </linearGradient>
  </defs>
  <rect width="250" height="240" fill="url(#bgAmericano)" rx="12"/>
  <!-- Saucer plate -->
  <ellipse cx="125" cy="198" rx="82" ry="18" fill="#d2c5b1" stroke="#b6a690" stroke-width="2"/>
  <ellipse cx="125" cy="196" rx="66" ry="12" fill="#ebe3d5"/>
  <!-- Mug handle -->
  <path d="M165 110 C198 110 198 162 160 166" fill="none" stroke="#faf7f0" stroke-width="11" stroke-linecap="round"/>
  <!-- Mug body -->
  <path d="M76 92 C80 176 90 191 125 191 C160 191 170 176 174 92 Z" fill="url(#mugWhite)"/>
  <!-- Cup rim border -->
  <ellipse cx="125" cy="92" rx="49" ry="16" fill="#190c05"/>
  <!-- Coffee surface -->
  <ellipse cx="125" cy="92" rx="45" ry="13" fill="url(#coffeeLiquid)"/>
  <!-- Surface reflection ring -->
  <path d="M88 92 C95 84 155 84 162 92" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.35"/>
  <ellipse cx="108" cy="94" rx="12" ry="3.5" fill="#693e22" opacity="0.5"/>
  <!-- Delicate steam curls -->
  <path d="M112 68 C106 52 118 42 112 28" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.4"/>
  <path d="M128 62 C122 46 134 36 128 22" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
  <path d="M142 66 C138 52 148 42 142 30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
</svg>
