<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 240" width="250" height="240">
  <defs>
    <linearGradient id="bgLatte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#725f51"/>
      <stop offset="100%" stop-color="#4a3b30"/>
    </linearGradient>
    <linearGradient id="cupLatte" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ebe2d3"/>
      <stop offset="50%" stop-color="#fdfbf8"/>
      <stop offset="100%" stop-color="#cfbeaa"/>
    </linearGradient>
    <linearGradient id="cremaLatte" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c89255"/>
      <stop offset="100%" stop-color="#7d4a22"/>
    </linearGradient>
  </defs>
  <rect width="250" height="240" fill="url(#bgLatte)" rx="12"/>
  <!-- Saucer plate -->
  <ellipse cx="125" cy="198" rx="84" ry="18" fill="#d0c2ad" stroke="#b4a38d" stroke-width="2"/>
  <ellipse cx="125" cy="196" rx="68" ry="12" fill="#ebe2d3"/>
  <!-- Cup handle -->
  <path d="M168 116 C198 116 198 165 162 168" fill="none" stroke="#fdfbf8" stroke-width="11" stroke-linecap="round"/>
  <!-- Cup body -->
  <path d="M72 100 C76 178 88 192 125 192 C162 192 174 178 178 100 Z" fill="url(#cupLatte)"/>
  <!-- Cup rim -->
  <ellipse cx="125" cy="100" rx="53" ry="17" fill="#7d4a22"/>
  <ellipse cx="125" cy="100" rx="49" ry="14" fill="url(#cremaLatte)"/>
  <!-- Latte Art: Tulip / Rosette -->
  <!-- Bottom leaf layer -->
  <path d="M125 108 C110 105 110 97 125 93 C140 97 140 105 125 108 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Middle leaf layer -->
  <path d="M125 103 C113 100 113 93 125 90 C137 93 137 100 125 103 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Top heart layer -->
  <path d="M125 97 C116 94 116 88 125 86 C134 88 134 94 125 97 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="122" cy="88" r="2.8" fill="#ffffff"/>
  <circle cx="128" cy="88" r="2.8" fill="#ffffff"/>
  <!-- Center drag line -->
  <line x1="125" y1="86" x2="125" y2="108" stroke="#7d4a22" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Steam lines -->
  <path d="M118 72 C114 58 122 48 118 36" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M132 68 C127 54 136 44 131 30" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" opacity="0.5"/>
</svg>
