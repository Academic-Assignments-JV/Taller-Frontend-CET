<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgRoast" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67574b"/>
      <stop offset="100%" stop-color="#44372e"/>
    </linearGradient>
    <linearGradient id="metalDrum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a959e"/>
      <stop offset="50%" stop-color="#454f59"/>
      <stop offset="100%" stop-color="#252c33"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bgRoast)" rx="12"/>
  <!-- Roaster Cooling Tray -->
  <ellipse cx="160" cy="150" rx="110" ry="35" fill="#2d3436" stroke="#636e72" stroke-width="3"/>
  <ellipse cx="160" cy="148" rx="98" ry="28" fill="#1b1c1e"/>
  <!-- Roasted coffee beans scattered -->
  <g fill="#4a2e1b">
    <ellipse cx="120" cy="145" rx="7" ry="5" transform="rotate(25 120 145)"/>
    <ellipse cx="140" cy="140" rx="8" ry="5" transform="rotate(-15 140 140)"/>
    <ellipse cx="160" cy="148" rx="7" ry="5" transform="rotate(40 160 148)"/>
    <ellipse cx="180" cy="142" rx="8" ry="5" transform="rotate(-30 180 142)"/>
    <ellipse cx="200" cy="147" rx="7" ry="5" transform="rotate(10 200 147)"/>
    <ellipse cx="135" cy="154" rx="7" ry="5" transform="rotate(60 135 154)"/>
    <ellipse cx="155" cy="156" rx="8" ry="5" transform="rotate(-45 155 156)"/>
    <ellipse cx="175" cy="153" rx="7" ry="5" transform="rotate(20 175 153)"/>
  </g>
  <!-- Roaster Drum upper segment -->
  <path d="M110 50 L210 50 L210 120 L110 120 Z" fill="url(#metalDrum)"/>
  <ellipse cx="160" cy="50" rx="50" ry="12" fill="#718093"/>
  <ellipse cx="160" cy="120" rx="50" ry="12" fill="#2f3640"/>
  <!-- Thermometer and hopper pipe -->
  <rect x="154" y="20" width="12" height="30" fill="#c23616" rx="4"/>
  <circle cx="160" cy="22" r="9" fill="#e84118" stroke="#ffffff" stroke-width="2"/>
  <!-- Aroma heat waves -->
  <path d="M140 40 Q130 25 140 15" stroke="#f5cd79" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M160 38 Q170 20 160 10" stroke="#f5cd79" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M180 40 Q170 25 180 15" stroke="#f5cd79" stroke-width="2" fill="none" opacity="0.6"/>
</svg>
