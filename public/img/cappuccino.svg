<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 240" width="250" height="240">
  <defs>
    <linearGradient id="bgCappuccino" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#746052"/>
      <stop offset="100%" stop-color="#4d3d32"/>
    </linearGradient>
    <linearGradient id="cupCeramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8ded0"/>
      <stop offset="50%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#cfbeaa"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#faf5ec"/>
      <stop offset="100%" stop-color="#ebdccb"/>
    </linearGradient>
  </defs>
  <rect width="250" height="240" fill="url(#bgCappuccino)" rx="12"/>
  <!-- Saucer plate -->
  <ellipse cx="125" cy="198" rx="84" ry="18" fill="#d0c2ad" stroke="#b4a38d" stroke-width="2"/>
  <ellipse cx="125" cy="196" rx="68" ry="12" fill="#e8ded0"/>
  <!-- Cup handle -->
  <path d="M168 116 C198 116 198 165 162 168" fill="none" stroke="#fdfbf7" stroke-width="11" stroke-linecap="round"/>
  <!-- Cup body -->
  <path d="M74 100 C78 178 88 192 125 192 C162 192 172 178 176 100 Z" fill="url(#cupCeramic)"/>
  <!-- Outer coffee crema ring border -->
  <ellipse cx="125" cy="100" rx="51" ry="17" fill="#6a3a18"/>
  <ellipse cx="125" cy="100" rx="47" ry="14" fill="#a4642d"/>
  <!-- Fluffy thick foam dome -->
  <ellipse cx="125" cy="98" rx="43" ry="12" fill="url(#foamGrad)"/>
  <!-- Cocoa powder dusted sprinkles -->
  <circle cx="115" cy="97" r="1.5" fill="#5a2e12"/>
  <circle cx="124" cy="99" r="1.8" fill="#5a2e12"/>
  <circle cx="132" cy="96" r="1.4" fill="#5a2e12"/>
  <circle cx="121" cy="94" r="1.2" fill="#5a2e12"/>
  <circle cx="128" cy="100" r="1.5" fill="#5a2e12"/>
  <circle cx="136" cy="98" r="1.2" fill="#5a2e12"/>
  <circle cx="112" cy="99" r="1.3" fill="#5a2e12"/>
  <circle cx="120" cy="102" r="1.1" fill="#5a2e12"/>
  <!-- Steam waves -->
  <path d="M116 75 C112 60 120 50 116 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M130 70 C125 55 135 44 130 30" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" opacity="0.5"/>
  <path d="M142 74 C138 62 145 52 141 40" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
</svg>
