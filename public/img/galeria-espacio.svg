<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgCafeRoom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e5a6b"/>
      <stop offset="100%" stop-color="#4a3848"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bgCafeRoom)" rx="12"/>
  <!-- Floor perspective -->
  <polygon points="0,170 320,170 320,220 0,220" fill="#2d221c"/>
  <line x1="60" y1="170" x2="30" y2="220" stroke="#1d1612" stroke-width="2"/>
  <line x1="160" y1="170" x2="160" y2="220" stroke="#1d1612" stroke-width="2"/>
  <line x1="260" y1="170" x2="290" y2="220" stroke="#1d1612" stroke-width="2"/>
  <!-- Window frame with outside greenery glow -->
  <rect x="30" y="35" width="85" height="100" rx="4" fill="#2a4736" stroke="#4a3728" stroke-width="4"/>
  <line x1="72" y1="35" x2="72" y2="135" stroke="#4a3728" stroke-width="3"/>
  <line x1="30" y1="85" x2="115" y2="85" stroke="#4a3728" stroke-width="3"/>
  <!-- Pendant Warm Lamps -->
  <line x1="180" y1="0" x2="180" y2="55" stroke="#111" stroke-width="2"/>
  <polygon points="170,68 190,68 184,55 176,55" fill="#f39c12"/>
  <circle cx="180" cy="74" r="6" fill="#f1c40f"/>
  <ellipse cx="180" cy="110" rx="40" ry="25" fill="#f1c40f" opacity="0.16"/>
  <!-- Table and Chairs -->
  <ellipse cx="180" cy="155" rx="55" ry="16" fill="#8d5524"/>
  <rect x="176" y="155" width="8" height="35" fill="#583515"/>
  <ellipse cx="180" cy="190" rx="22" ry="6" fill="#35200d"/>
  <!-- Coffee cup on table -->
  <ellipse cx="175" cy="148" rx="8" ry="3" fill="#ffffff"/>
  <rect x="171" y="145" width="8" height="5" fill="#ffffff" rx="1"/>
  <!-- Potted plant on side -->
  <polygon points="260,185 275,185 272,205 263,205" fill="#c0392b"/>
  <circle cx="264" cy="176" r="9" fill="#27ae60"/>
  <circle cx="272" cy="173" r="8" fill="#2ecc71"/>
</svg>
