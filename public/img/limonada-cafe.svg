<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 240" width="250" height="240">
  <defs>
    <linearGradient id="bgLimon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c6d5b"/>
      <stop offset="100%" stop-color="#48493a"/>
    </linearGradient>
    <linearGradient id="coffeeLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2112"/>
      <stop offset="100%" stop-color="#704423"/>
    </linearGradient>
    <linearGradient id="lemonLayer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2cf47"/>
      <stop offset="100%" stop-color="#ddba28"/>
    </linearGradient>
  </defs>
  <rect width="250" height="240" fill="url(#bgLimon)" rx="12"/>
  <!-- Glass shadow -->
  <ellipse cx="125" cy="214" rx="42" ry="8" fill="#181a13" opacity="0.6"/>
  <!-- Lemon juice layer (bottom) -->
  <path d="M96 145 L154 145 L149 205 C149 210 143 213 138 213 L112 213 C107 213 101 210 101 205 Z" fill="url(#lemonLayer)"/>
  <!-- Cold coffee layer (top) -->
  <path d="M90 78 L160 78 L154 145 L96 145 Z" fill="url(#coffeeLayer)"/>
  <!-- Ice cubes -->
  <rect x="105" y="95" width="22" height="22" rx="3" fill="#ffffff" fill-opacity="0.36" stroke="#ffffff" stroke-width="1.2" transform="rotate(15 116 106)"/>
  <rect x="122" y="140" width="20" height="20" rx="3" fill="#ffffff" fill-opacity="0.36" stroke="#ffffff" stroke-width="1.2" transform="rotate(-10 132 150)"/>
  <!-- Glass outline -->
  <path d="M88 68 L162 68 L151 206 C150 212 144 216 137 216 L113 216 C106 216 100 212 99 206 Z" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.55"/>
  <ellipse cx="125" cy="68" rx="37" ry="6" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Lemon wheel on rim -->
  <circle cx="88" cy="65" r="24" fill="#f4d03f" stroke="#e0b820" stroke-width="2.5"/>
  <circle cx="88" cy="65" r="18" fill="#fef9e7"/>
  <path d="M88 47 L88 83 M70 65 L106 65 M75 52 L101 78 M75 78 L101 52" stroke="#e0b820" stroke-width="1.5"/>
  <!-- Mint leaf garnish -->
  <path d="M150 56 C165 48 172 58 165 70 C155 68 152 60 150 56 Z" fill="#48a050"/>
  <!-- Sparkle dots -->
  <circle cx="108" cy="175" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="138" cy="185" r="1.5" fill="#ffffff" opacity="0.7"/>
</svg>
