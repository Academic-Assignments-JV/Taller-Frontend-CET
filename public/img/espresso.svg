<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 240" width="250" height="240">
  <defs>
    <linearGradient id="bgEspresso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#725e51"/>
      <stop offset="100%" stop-color="#4c3c31"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ece2d0"/>
      <stop offset="50%" stop-color="#faf6ee"/>
      <stop offset="100%" stop-color="#cfbeaa"/>
    </linearGradient>
    <linearGradient id="cremaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d49b55"/>
      <stop offset="50%" stop-color="#b07335"/>
      <stop offset="100%" stop-color="#693b16"/>
    </linearGradient>
  </defs>
  <rect width="250" height="240" fill="url(#bgEspresso)" rx="12"/>
  <!-- Saucer plate -->
  <ellipse cx="125" cy="198" rx="76" ry="17" fill="#d1c3ad" stroke="#b4a389" stroke-width="2"/>
  <ellipse cx="125" cy="196" rx="60" ry="11" fill="#ece2d0"/>
  <!-- Demitasse cup handle -->
  <path d="M156 128 C182 128 182 168 152 170" fill="none" stroke="#faf6ee" stroke-width="9" stroke-linecap="round"/>
  <!-- Demitasse cup body -->
  <path d="M84 115 C88 180 98 190 125 190 C152 190 162 180 166 115 Z" fill="url(#cupGrad)"/>
  <!-- Cup rim -->
  <ellipse cx="125" cy="115" rx="41" ry="13" fill="#693b16"/>
  <!-- Crema surface -->
  <ellipse cx="125" cy="115" rx="38" ry="11" fill="url(#cremaGrad)"/>
  <!-- Crema tiger mottling / swirls -->
  <path d="M110 114 C116 118 132 118 138 114 C132 111 118 111 110 114 Z" fill="#e7b97a" opacity="0.8"/>
  <ellipse cx="122" cy="113" rx="7" ry="2.5" fill="#f5d5a4" opacity="0.9"/>
  <ellipse cx="132" cy="116" rx="4" ry="1.5" fill="#542e0f" opacity="0.7"/>
  <circle cx="114" cy="116" r="1.5" fill="#542e0f" opacity="0.6"/>
  <!-- Steam lines -->
  <path d="M120 95 C116 82 124 72 120 60" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>
  <path d="M132 92 C128 78 136 68 132 54" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
</svg>
