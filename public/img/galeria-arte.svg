<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#625f72"/>
      <stop offset="100%" stop-color="#423f4f"/>
    </linearGradient>
    <linearGradient id="coffeeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#51301c"/>
      <stop offset="100%" stop-color="#321b0e"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bgArt)" rx="12"/>
  <!-- Top-down view plate -->
  <circle cx="160" cy="110" r="95" fill="#f8f9fa" stroke="#e9ecef" stroke-width="4"/>
  <!-- Ceramic Cup -->
  <circle cx="160" cy="110" r="75" fill="#2f3542"/>
  <!-- Cup handle top-down -->
  <rect x="235" y="102" width="18" height="16" rx="6" fill="#2f3542"/>
  <!-- Crema surface -->
  <circle cx="160" cy="110" r="66" fill="url(#coffeeDark)"/>
  <!-- Elegant Tulip Latte Art Pattern -->
  <path d="M160 148 C145 130 145 110 160 95 C175 110 175 130 160 148 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M160 125 C148 112 148 95 160 82 C172 95 172 112 160 125 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M160 102 C152 90 152 78 160 68 C168 78 168 90 160 102 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Heart top cap -->
  <circle cx="156" cy="62" r="5" fill="#ffffff"/>
  <circle cx="164" cy="62" r="5" fill="#ffffff"/>
  <!-- Pull line through center -->
  <line x1="160" y1="58" x2="160" y2="152" stroke="#51301c" stroke-width="2"/>
</svg>
